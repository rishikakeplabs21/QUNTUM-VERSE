<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="qgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Quantum Orbital Rings -->
  <ellipse cx="50" cy="50" rx="42" ry="16" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" transform="rotate(-30 50 50)" />
  <ellipse cx="50" cy="50" rx="42" ry="16" stroke="#6366f1" stroke-width="2.5" opacity="0.8" transform="rotate(30 50 50)" />
  <ellipse cx="50" cy="50" rx="42" ry="16" stroke="#f59e0b" stroke-width="2.5" opacity="0.8" transform="rotate(90 50 50)" />
  <!-- Core Node -->
  <circle cx="50" cy="50" r="10" fill="url(#qgrad)" filter="url(#glow)" />
  <circle cx="50" cy="50" r="4" fill="#ffffff" />
  <!-- Qubit Nodes on Orbits -->
  <circle cx="20" cy="32" r="3.5" fill="#38bdf8" />
  <circle cx="80" cy="68" r="3.5" fill="#38bdf8" />
  <circle cx="78" cy="33" r="3.5" fill="#f59e0b" />
  <circle cx="22" cy="67" r="3.5" fill="#f59e0b" />
</svg>
